name: Build LUIYo IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: luiyo-ipa-main
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Restore full v1.0.6 build45 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/luiyo-src.zip "https://files.catbox.moe/do0jdn.zip"
          rm -rf /tmp/luiyo-extract && mkdir -p /tmp/luiyo-extract
          unzip -qo /tmp/luiyo-src.zip -d /tmp/luiyo-extract
          if [ -d /tmp/luiyo-extract/YouYouLUI_iOS ]; then SRC=/tmp/luiyo-extract
          else SRC=$(find /tmp/luiyo-extract -maxdepth 2 -type d -name 'YouYouLUI_iOS' | head -1 | xargs dirname); fi
          # Save native patch before rsync (rsync --delete would remove it)
          cp patches/hero-native.patch /tmp/hero-native.patch 2>/dev/null || true
          rsync -a --delete --exclude '.git' --exclude '.github' "$SRC"/ ./
          # Apply native badge patch (top card: LUIYo + membership badge)
          if [ -f /tmp/hero-native.patch ]; then
            patch -p0 --no-backup-if-mismatch -i /tmp/hero-native.patch && echo "Native badge patch applied" || echo "Native patch failed!"
          fi
          # Build 号 +1 (当前 51 -> 52)
          INFO_PLIST="YouYouLUI_iOS/YouYouLUI/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            CURRENT_BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$INFO_PLIST" 2>/dev/null || echo "51")
            NEW_BUILD=$((CURRENT_BUILD + 1))
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD" "$INFO_PLIST" 2>/dev/null || true
            echo "Build number: $CURRENT_BUILD -> $NEW_BUILD"
          fi
          grep -q 'forceBlockedVersion' YouYouLUI_iOS/YouYouLUI/AppDelegate.swift
          grep -q 'exit(0)' YouYouLUI_iOS/YouYouLUI/AppDelegate.swift
          sed -i.bak -E "s/test \"\$BUILD\" = '[0-9]+'/true/g; s/test \"\$VERSION\" = '1\\.0\\.[0-9]+'/true/g" scripts/build-ipa.sh || true
          echo "Source ready (force exit on blocked version)"
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-ipa.sh
          ls -lh output/
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUIYo-v1.0.6-build45-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 5
      - name: Publish latest IPA link
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/publish-ipa.sh
