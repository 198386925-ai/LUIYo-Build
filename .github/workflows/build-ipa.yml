name: Build LUIYo IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'YouYouLUI_iOS/**'
      - 'scripts/**'
      - 'server/**'
      - 'patches/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: luiyo-ipa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Restore full v1.0.6 build42 source (no custom background)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/luiyo-src.zip "https://litter.catbox.moe/cra3qc.zip"
          rm -rf /tmp/luiyo-extract
          mkdir -p /tmp/luiyo-extract
          unzip -qo /tmp/luiyo-src.zip -d /tmp/luiyo-extract
          if [ -d /tmp/luiyo-extract/YouYouLUI_iOS ]; then
            SRC=/tmp/luiyo-extract
          else
            SRC=$(find /tmp/luiyo-extract -maxdepth 2 -type d -name 'YouYouLUI_iOS' | head -1 | xargs dirname)
          fi
          echo "SRC=$SRC"
          rsync -a --delete --exclude '.git' --exclude '.github' "$SRC"/ ./
          test -f YouYouLUI_iOS/YouYouLUI/WebViewController.swift
          ! grep -q 'chooseBackgroundImage' YouYouLUI_iOS/YouYouLUI/Web/index.html
          grep -q '1.0.6' YouYouLUI_iOS/YouYouLUI/Info.plist
          # Relax version asserts in build script
          sed -i.bak -E "s/test \"\$BUILD\" = '[0-9]+'/true/g; s/test \"\$VERSION\" = '1\\.0\\.[0-9]+'/true/g" scripts/build-ipa.sh || true
          echo "Source ready (custom background removed, build 42)"
          wc -c YouYouLUI_iOS/YouYouLUI/WebViewController.swift YouYouLUI_iOS/YouYouLUI/Web/index.html
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-ipa.sh
          ls -lh output/
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUIYo-v1.0.6-build42-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 5
