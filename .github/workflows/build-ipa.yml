name: Build LUIYo IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

concurrency:
  group: luiyo-ipa-main
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Restore full v1.0.6 build45 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/luiyo-src.zip "https://files.catbox.moe/z0dvzu.zip"
          rm -rf /tmp/luiyo-extract && mkdir -p /tmp/luiyo-extract
          unzip -qo /tmp/luiyo-src.zip -d /tmp/luiyo-extract
          if [ -d /tmp/luiyo-extract/YouYouLUI_iOS ]; then SRC=/tmp/luiyo-extract
          else SRC=$(find /tmp/luiyo-extract -maxdepth 2 -type d -name 'YouYouLUI_iOS' | head -1 | xargs dirname); fi
          rsync -a --delete --exclude '.git' --exclude '.github' "$SRC"/ ./
          grep -q 'forceBlockedVersion' YouYouLUI_iOS/YouYouLUI/AppDelegate.swift
          grep -q 'exit(0)' YouYouLUI_iOS/YouYouLUI/AppDelegate.swift
          sed -i.bak -E "s/test \"\$BUILD\" = '[0-9]+'/true/g; s/test \"\$VERSION\" = '1\\.0\\.[0-9]+'/true/g" scripts/build-ipa.sh || true
          echo "Source ready (force exit on blocked version)"
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-ipa.sh
          ls -lh output/
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUIYo-v1.0.6-build45-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 5
      - name: Publish latest IPA link
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/publish-ipa.sh
