name: Build LUIYo IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'YouYouLUI_iOS/**'
      - 'scripts/**'
      - 'server/**'
      - 'patches/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: luiyo-ipa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Download and extract full v1.0.6 build41 fixed source
        shell: bash
        run: |
          set -euo pipefail
          # Full fixed source (your latest + background-overlap fix)
          curl -fsSL -o /tmp/luiyo-src.zip "https://litter.catbox.moe/cs44rd.bin"
          rm -rf /tmp/luiyo-extract
          mkdir -p /tmp/luiyo-extract
          unzip -qo /tmp/luiyo-src.zip -d /tmp/luiyo-extract
          # Layout may be flat or nested
          if [ -d /tmp/luiyo-extract/YouYouLUI_iOS ]; then
            SRC=/tmp/luiyo-extract
          else
            SRC=$(find /tmp/luiyo-extract -maxdepth 2 -type d -name 'YouYouLUI_iOS' | head -1 | xargs dirname)
          fi
          echo "SRC=$SRC"
          # Replace workspace with full source (keep .git)
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            "$SRC"/ ./ 
          # Ensure workflow stays
          test -f YouYouLUI_iOS/YouYouLUI/WebViewController.swift
          grep -q 'clearAllNativeCardMaterials' YouYouLUI_iOS/YouYouLUI/WebViewController.swift
          grep -q '1.0.6' YouYouLUI_iOS/YouYouLUI/Info.plist
          echo "Full v1.0.6 fixed source ready"
          wc -c YouYouLUI_iOS/YouYouLUI/WebViewController.swift YouYouLUI_iOS/YouYouLUI/Web/index.html
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          # Align build script version checks
          if [ -f scripts/build-ipa.sh ]; then
            sed -i.bak "s/test \"\$VERSION\" = '1.0.6'/true/; s/test \"\$BUILD\" = '41'/true/; s/test \"\$VERSION\" = '1.0.5'/true/; s/test \"\$BUILD\" = '26'/true/; s/test \"\$BUILD\" = '40'/true/" scripts/build-ipa.sh || true
            bash scripts/build-ipa.sh
          else
            mkdir -p output
            xcodebuild \
              -project YouYouLUI_iOS/YouYouLUI.xcodeproj \
              -scheme YouYouLUI -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            APP=build/Build/Products/Release-iphoneos/YouYouLUI.app
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
            BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
            STAGE=$(mktemp -d)
            mkdir -p "$STAGE/Payload"
            cp -R "$APP" "$STAGE/Payload/"
            NAME="LUIYo-v${VERSION}-build${BUILD}-ios26-${GITHUB_RUN_NUMBER}-unsigned.ipa"
            (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/output/$NAME" Payload)
          fi
          ls -lh output/
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUIYo-v1.0.6-build41-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 5
