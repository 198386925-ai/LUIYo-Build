name: Build LUIYo IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'YouYouLUI_iOS/**'
      - 'scripts/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: luiyo-ipa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    # Standard public runner: never consume private repository build minutes.
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Validate native bridge
        run: |
          node YouYouLUI_iOS/verify-material-bridge.js YouYouLUI_iOS/YouYouLUI/Web/index.html
          node scripts/check-theme-upload.js YouYouLUI_iOS/YouYouLUI/Web/index.html
      - name: Check activation and completed ZIP export
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/luiyo-dom" jsdom@26 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/luiyo-dom/node_modules" node scripts/check-activation-export.js
      - name: Build with iOS 26 SDK
        shell: bash
        run: bash scripts/build-ipa.sh
      - name: Save compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUIYo-Build19-${{ github.run_number }}-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 1
  simulator-check:
    # Diagnostic-only; do not fail ordinary IPA builds because of simulator flakiness.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Check native materials in iOS 26 simulator
        timeout-minutes: 20
        shell: bash
        run: bash scripts/check-license-native.sh
      - name: Save native check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUIYo-Build19-${{ github.run_number }}-native-check
          path: |
            native-check/*.png
            native-check/*.json
            native-check/*.xcresult
            native-check/*.log
          if-no-files-found: ignore
          retention-days: 1
