name: Build LUIYo IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'YouYouLUI_iOS/**'
      - 'scripts/**'
      - 'server/**'
      - 'patches/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: luiyo-ipa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  backend-check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check backend and migrations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-xml php-mbstring
          for file in server/*.php; do php -l "$file"; done
          python3 scripts/check-device-service.py || true
  build:
    needs: backend-check
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Restore large source files from base64 parts
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'clearAllNativeCardMaterials' YouYouLUI_iOS/YouYouLUI/WebViewController.swift 2>/dev/null; then
            if ls patches/restore/wvc_*.b64 1>/dev/null 2>&1; then
              cat patches/restore/wvc_*.b64 | base64 -d > YouYouLUI_iOS/YouYouLUI/WebViewController.swift
              echo "Restored WebViewController.swift"
            fi
          fi
          if [ "$(wc -c < YouYouLUI_iOS/YouYouLUI/Web/index.html 2>/dev/null || echo 0)" -lt 1000 ]; then
            if ls patches/restore/idx_*.b64 1>/dev/null 2>&1; then
              cat patches/restore/idx_*.b64 | base64 -d > YouYouLUI_iOS/YouYouLUI/Web/index.html
              echo "Restored index.html"
            fi
          fi
          if [ -f patches/restore/jszip.b64 ]; then
            base64 -d patches/restore/jszip.b64 > YouYouLUI_iOS/YouYouLUI/Web/jszip.min.js
          fi
          if [ -f patches/restore/catalog.b64 ]; then
            base64 -d patches/restore/catalog.b64 > YouYouLUI_iOS/YouYouLUI/Web/native-preview-catalog.json
          fi
          grep -q 'clearAllNativeCardMaterials' YouYouLUI_iOS/YouYouLUI/WebViewController.swift
          echo "Source check passed"
      - name: Build IPA
        shell: bash
        run: bash scripts/build-ipa.sh
      - name: Save compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUIYo-v1.0.6-${{ github.run_number }}-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 3
