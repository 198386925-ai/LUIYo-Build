name: Build LUIYo IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: luiyo-ipa-main
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Use repo source directly
        shell: bash
        run: |
          set -euo pipefail
          echo "Using repo source at ./YouYouLUI_iOS/ (no download needed)"
          # Verify our cell modification is present
          grep -n '普通会员' YouYouLUI_iOS/YouYouLUI/LUISettingsHeroCell.m | head -2 || echo "WARNING: cell fix not found!"
          # Set version to 1.0.7 Build 1
          INFO_PLIST="YouYouLUI_iOS/YouYouLUI/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.7" "$INFO_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$INFO_PLIST" 2>/dev/null || true
            echo "Version set to 1.0.7 Build 1"
          fi
          # Save source as tar for artifact
          tar -czf /tmp/luiyo-source.tar.gz -C . ./YouYouLUI_iOS 2>/dev/null || true
          echo "Source ready"

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-ipa.sh
          ls -lh output/
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUIYo-v1.0.6-build45-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 5
      - name: Publish latest IPA link
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/publish-ipa.sh
