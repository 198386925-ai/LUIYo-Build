name: Build LUIYo IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'YouYouLUI_iOS/**'
      - 'scripts/**'
      - 'server/**'
      - 'patches/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: luiyo-ipa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  backend-check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check backend and migrations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-xml php-mbstring
          for file in server/*.php; do [ -f "$file" ] && php -l "$file" || true; done
          [ -f scripts/check-device-service.py ] && python3 scripts/check-device-service.py || true
  build:
    needs: backend-check
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Restore sources and apply background-overlap fix
        shell: bash
        run: |
          set -euo pipefail
          GOOD_SHA=8aaba2a3162f4475b912a40af9a417b5e98b2eef
          if ! grep -q 'clearAllNativeCardMaterials' YouYouLUI_iOS/YouYouLUI/WebViewController.swift 2>/dev/null; then
            echo "Restoring ${GOOD_SHA} sources and applying patches..."
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${GOOD_SHA}/YouYouLUI_iOS/YouYouLUI/WebViewController.swift" \
              -o YouYouLUI_iOS/YouYouLUI/WebViewController.swift
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${GOOD_SHA}/YouYouLUI_iOS/YouYouLUI/Web/index.html" \
              -o YouYouLUI_iOS/YouYouLUI/Web/index.html
            if [ -f patches/WebViewController.swift.patch ]; then
              patch -p1 < patches/WebViewController.swift.patch || true
            fi
            if [ -f patches/index.html.patch ]; then
              patch -p1 < patches/index.html.patch || true
            fi
          fi
          # Ensure fix is present even if patch already applied upstream
          if ! grep -q 'clearAllNativeCardMaterials' YouYouLUI_iOS/YouYouLUI/WebViewController.swift; then
            echo "ERROR: background-overlap fix missing after restore"
            exit 1
          fi
          echo "Background-overlap fix present."
      - name: Build with iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          # Prefer scripts/build-ipa.sh if it works; otherwise inline minimal build
          if [ -f scripts/build-ipa.sh ]; then
            # Relax version checks for restored 1.0.5 sources
            sed -i.bak "s/test \"\$VERSION\" = '1.0.6'/true/" scripts/build-ipa.sh || true
            sed -i.bak "s/test \"\$BUILD\" = '41'/true/" scripts/build-ipa.sh || true
            sed -i.bak "s/test \"\$VERSION\" = '1.0.5'/true/" scripts/build-ipa.sh || true
            sed -i.bak "s/test \"\$BUILD\" = '26'/true/" scripts/build-ipa.sh || true
            bash scripts/build-ipa.sh || {
              echo "build-ipa.sh failed, trying inline build..."
              mkdir -p output
              xcodebuild \
                -project YouYouLUI_iOS/YouYouLUI.xcodeproj \
                -scheme YouYouLUI -configuration Release \
                -sdk iphoneos -destination 'generic/platform=iOS' \
                -derivedDataPath build \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
              APP=build/Build/Products/Release-iphoneos/YouYouLUI.app
              test -f "$APP/YouYouLUI"
              VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
              BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
              STAGE=$(mktemp -d)
              mkdir -p "$STAGE/Payload"
              cp -R "$APP" "$STAGE/Payload/"
              NAME="LUIYo-v${VERSION}-build${BUILD}-ios26-${GITHUB_RUN_NUMBER:-local}-unsigned.ipa"
              (cd "$STAGE" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/output/$NAME" Payload)
              echo "IPA: output/$NAME"
            }
          else
            mkdir -p output
            xcodebuild \
              -project YouYouLUI_iOS/YouYouLUI.xcodeproj \
              -scheme YouYouLUI -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            APP=build/Build/Products/Release-iphoneos/YouYouLUI.app
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
            BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
            STAGE=$(mktemp -d)
            mkdir -p "$STAGE/Payload"
            cp -R "$APP" "$STAGE/Payload/"
            NAME="LUIYo-v${VERSION}-build${BUILD}-ios26-${GITHUB_RUN_NUMBER:-local}-unsigned.ipa"
            (cd "$STAGE" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/output/$NAME" Payload)
          fi
      - name: Save compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUIYo-IPA-${{ github.run_number }}
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 3
